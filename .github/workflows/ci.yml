name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest pytest-mock

      - name: Run Syntax & Import Checks
        run: |
          python -m py_compile setup.py insight/*.py
          python -c "import insight; print('Insight package loaded successfully')"
        env:
          GOOGLE_API_KEY: "dummy_ci_key"

      - name: Run Pytest (if tests exist)
        run: |
          if [ -d "tests" ]; then
            pytest tests/
          else
            echo "No tests directory found yet. Skipping pytest."
          fi
        env:
          GOOGLE_API_KEY: "dummy_ci_key"
